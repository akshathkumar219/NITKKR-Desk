<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F1E8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Timetable, roll call, mess board and campus info for NIT Kurukshetra."
    />
    <title>NITKKR BOARD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ribeye&family=League+Spartan:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Prevent theme flash: apply stored theme before first paint.
      // storage.js writes through JSON.stringify, so the raw value is '"dark"'
      // (quotes included) — parse it rather than comparing the raw string.
      try {
        var raw = localStorage.getItem('kkr.theme')
        var t = raw === null ? null : JSON.parse(raw)
        if (t !== 'dark' && t !== 'light')
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (t === 'dark') document.documentElement.classList.add('dark')
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', t === 'dark' ? '#080D18' : '#F4F1E8')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
